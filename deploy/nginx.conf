server {
    listen 80;
    listen [::]:80;
    server_name learn.brokenbeat.ca;

    root /var/www/learn.brokenbeat.ca;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # The service worker handles offline caching; make browsers revalidate
    # app files so new deploys show up promptly.
    location ~* \.(?:js|css|json)$ {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
}
